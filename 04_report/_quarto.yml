project:
  type: book
  output-dir: ../05_outputs/report

book:
  title: "Gasto Público en el Sector Agropecuario de Bolivia"
  subtitle: "Análisis de Nivel, Composición y Eficiencia 2000–2023"
  author:
    - name: "Katie Kennedy Freeman"
      affiliation: "World Bank"
    - name: "Mariángela Ramírez Díaz"
      affiliation: "World Bank"
    - name: "Héctor Peña"
      affiliation: "World Bank"
    - name: "Juan Carlos Muñoz-Mora"
      affiliation: "Centro Valor Público at Universidad EAFIT (Colombia)"
  date: "2026"
  language: es

  chapters:
    - index.qmd
    - 01_introduction.qmd
    - 02_sector_performance.qmd
    - 03_budget_institutions.qmd
    - 04_spending_organization.qmd
    - 05_spending_analysis.qmd
    - 06_recommendations.qmd
    - references.qmd

  appendices:
    - appendix/A_data_sources.qmd
    - appendix/B_methodology.qmd
    - appendix/C_glosario_mafap.qmd
    - appendix/D_crosswalk_clasificaciones.qmd
    - appendix/E_regresiones_panel_fe.qmd
    - appendix/F_dea_simar_wilson.qmd
    - appendix/G_programas_bm.qmd
    - appendix/H_adrs_metodologicos.qmd
    - appendix/I_declaracion_ia.qmd

bibliography: references.bib
csl: style/world-development.csl

execute:
  freeze: auto          # no re-ejecutar análisis costosos al editar
  echo: false           # no mostrar código en el reporte final
  warning: false
  message: false
  cache: true

format:
  html:
    theme:
      - cosmo
      - style/wb_report.scss
    toc: true
    toc-depth: 3
    toc-title: "Contenido"
    number-sections: true
    smooth-scroll: true
    self-contained: true   # un solo archivo HTML para distribución
    lang: es

  pdf:
    documentclass: report
    classoption: [12pt, oneside]
    papersize: letter
    include-in-header: style/wb_report.tex
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    linkcolor: "009FDA"
    lang: es
    keep-tex: false

  # Capa de revisión MS Word para el Banco (ver .agent/23_WORD_ROUNDTRIP.md).
  # NO es la fuente de verdad: el .docx se regenera desde los .qmd cada ciclo.
  docx:
    reference-doc: style/reference-doc.docx
    toc: true
    toc-depth: 3
    number-sections: true
    lang: es
    # Figuras embebidas como imagen (no editables en Word; se regeneran desde script).

knitr:
  opts_chunk:
    fig.align: center
    fig.width: 7
    fig.height: 4.5
    dpi: 300
    out.width: "100%"
