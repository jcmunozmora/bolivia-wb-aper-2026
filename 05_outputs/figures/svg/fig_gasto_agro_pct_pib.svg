<text x='48.46' y='36.81' style='font-size: 9.60px;fill: #666666; font-family: "Arial";' textLength='555.39px' lengthAdjust='spacingAndGlyphs'>Gasto público agropecuario como proporción del PIB, 2000–2023. El gasto total (corriente+capital) se ubica en ~1,0–1,4% del PIB;</text>
<text x='48.46' y='48.91' style='font-size: 9.60px;fill: #666666; font-family: "Arial";' textLength='516.77px' lengthAdjust='spacingAndGlyphs'>la inversión sola, en ~0,3–0,7%. Para un sector que aporta cerca del 12% del PIB, la intensidad del gasto público es baja.</text>
<text x='48.46' y='21.62' style='font-size: 13.50px; font-weight: bold;fill: #2C3E50; font-family: "Arial";' textLength='385.70px' lengthAdjust='spacingAndGlyphs'>El gasto público agropecuario boliviano ronda el 1% del PIB</text>
<text x='11.96' y='405.95' style='font-size: 8.00px;fill: #7F7F7F; font-family: "Arial";' textLength='1028.52px' lengthAdjust='spacingAndGlyphs'>Fuente: cálculo propio (Banco Mundial) sobre panel v12 — MEFP Presupuesto Abierto (gasto total devengado, 2016–2023), BOOST (2006–2008) y VIPFE (inversión). PIB en BOB corrientes (INE). El gasto total 2009–2015 no tiene fuente directa (gap declarado, ADR-0012); no se interpola.</text>
