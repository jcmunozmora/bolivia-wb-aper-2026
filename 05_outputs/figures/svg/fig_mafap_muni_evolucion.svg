<text x='52.65' y='45.22' style='font-size: 8.60px;fill: #666666; font-family: "Arial";' textLength='387.55px' lengthAdjust='spacingAndGlyphs'>El apoyo a la producción (categoría A) pasó de 33% a 53% y cruzó a los bienes públicos (D) en 2024.</text>
<text x='52.65' y='20.68' style='font-size: 12.20px; font-weight: bold;fill: #2C3E50; font-family: "Arial";' textLength='560.91px' lengthAdjust='spacingAndGlyphs'>El gasto agropecuario municipal viró del riego hacia el apoyo directo a la producción, 2016–2024</text>
<text x='15.94' y='347.98' style='font-size: 7.40px;fill: #7F7F7F; font-family: "Arial";' textLength='380.02px' lengthAdjust='spacingAndGlyphs'>Fuente: cálculo propio (Banco Mundial) sobre MEFP Presupuesto Abierto (devengado SIGEP por entidad municipal,</text>
<text x='15.94' y='357.75' style='font-size: 7.40px;fill: #7F7F7F; font-family: "Arial";' textLength='312.91px' lengthAdjust='spacingAndGlyphs'>clasificación por actividad económica agropecuaria); crosswalk actividad→MAFAP (ADR-0015).</text>
<text x='15.94' y='367.51' style='font-size: 7.40px;fill: #7F7F7F; font-family: "Arial";' textLength='348.86px' lengthAdjust='spacingAndGlyphs'>Nota: capta el gasto del gobierno municipal (POA), no la ejecución del nivel central ni departamental. ~329</text>
<text x='15.94' y='377.28' style='font-size: 7.40px;fill: #7F7F7F; font-family: "Arial";' textLength='292.28px' lengthAdjust='spacingAndGlyphs'>municipios/año; cobertura 99,7% del total agropecuario municipal MEFP. 2024 preliminar.</text>
