<text x='123.52' y='461.56' style='font-size: 8.00px;fill: #7F7F7F; font-family: "Arial";' textLength='680.55px' lengthAdjust='spacingAndGlyphs'>Fuente: MapBiomas Bolivia (Colección 3). 'Expansión antrópica' = aumento del área bajo uso humano. La cifra dentro de la barra indica el % del territorio municipal bajo uso antrópico en 2024.</text>
