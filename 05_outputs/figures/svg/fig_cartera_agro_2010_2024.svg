<text x='50.42' y='36.81' style='font-size: 9.60px;fill: #666666; font-family: "Arial";' textLength='493.98px' lengthAdjust='spacingAndGlyphs'>Cartera bancaria al sector agropecuario (USD constantes de 2015) y su participación en la cartera total, 2010–2024.</text>
<text x='50.42' y='48.91' style='font-size: 9.60px;fill: #666666; font-family: "Arial";' textLength='452.25px' lengthAdjust='spacingAndGlyphs'>En términos reales la cartera se multiplicó por 7.1 y su participación pasó de 5,1% a 11,7% (hallazgo F05).</text>
<text x='50.42' y='21.62' style='font-size: 13.50px; font-weight: bold;fill: #2C3E50; font-family: "Arial";' textLength='509.59px' lengthAdjust='spacingAndGlyphs'>El crédito dirigido al agro se multiplicó y duplicó su peso en la cartera bancaria</text>
<text x='11.96' y='405.95' style='font-size: 8.00px;fill: #7F7F7F; font-family: "Arial";' textLength='1037.80px' lengthAdjust='spacingAndGlyphs'>Fuente: cálculo propio (Banco Mundial) sobre BCB Boletín Estadístico Cuadro 3.02 (solo banca múltiple; subestima el crédito total del sistema). Deflactado a USD constantes de 2015 con el CPI de Bolivia (INE, 2015=100; 2024 preliminar). Régimen de cuotas y tasas reguladas: Ley 393/2014.</text>
