<text x='11.96' y='266.78' style='font-size: 8.00px;fill: #666666; font-family: "Inter";' textLength='340.23px' lengthAdjust='spacingAndGlyphs'>Fuente: IDB AgriMonitor (GSSE); cálculo propio (Banco Mundial) sobre panel v12 [m0.2.0].</text>
<text x='11.96' y='278.30' style='font-size: 8.00px;fill: #666666; font-family: "Inter";' textLength='1228.39px' lengthAdjust='spacingAndGlyphs'>Nota: MAFAP D = apoyo general al sector (servicios públicos), proxy = GSSE OECD. Conceptualmente comprende I+D (INIAF), extensión, sanidad (SENASAG), infraestructura sectorial, etc.; la desagregación por subcategoría (D1–D10) requiere clasificación funcional BOOST granular y no se cuantifica en este panel agregado.</text>
