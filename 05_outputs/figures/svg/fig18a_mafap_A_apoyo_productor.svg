<text x='11.96' y='278.30' style='font-size: 8.00px;fill: #666666; font-family: "Inter";' textLength='957.83px' lengthAdjust='spacingAndGlyphs'>Nota: marco de gasto público MAFAP (Vol II). El sostén de precios (MPS) NO es gasto público y se reporta como OECD-PSE en el Capítulo 5. Los valores negativos reflejan net-imposición al productor vía restricciones de exportación (coherente con F03).</text>
