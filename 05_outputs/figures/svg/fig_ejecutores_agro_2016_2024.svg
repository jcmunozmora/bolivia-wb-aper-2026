<text x='50.92' y='48.05' style='font-size: 9.40px;fill: #666666; font-family: "Arial";' textLength='764.22px' lengthAdjust='spacingAndGlyphs'>La empresa estatal de alimentos (EMAPA) pasó de 25% a 42% del gasto, casi exactamente lo que perdió el bloque subnacional (38%→22%); el ministerio rector se mantuvo en ~19%.</text>
<text x='50.92' y='21.26' style='font-size: 13.00px; font-weight: bold;fill: #2C3E50; font-family: "Arial";' textLength='595.22px' lengthAdjust='spacingAndGlyphs'>EMAPA desplazó a los gobiernos subnacionales como principal ejecutor del gasto agropecuario</text>
<text x='11.96' y='405.95' style='font-size: 8.00px;fill: #7F7F7F; font-family: "Arial";' textLength='623.30px' lengthAdjust='spacingAndGlyphs'>Fuente: cálculo propio (Banco Mundial) sobre MEFP Presupuesto Abierto (gasto devengado SIGEP); más de 340 entidades ejecutan gasto del sector cada año. Ver ADR-0012.</text>
