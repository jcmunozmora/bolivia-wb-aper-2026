name: Publish Quarto site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "01_data/timeline/**"
      - "00_admin/Inventario_Datos_APER_Bolivia_2026.xlsx"
      - "00_admin/ESTADO_DE_DATOS.md"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.7.34"

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::ggplot2
            any::scales
            any::gt
            any::here
            any::fixest

      - name: Render Quarto site
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd www
          quarto render

      - name: Add .nojekyll
        run: touch docs/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
